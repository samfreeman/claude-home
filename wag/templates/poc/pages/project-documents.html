<!doctype html>
<!-- WAG POC starter: the standard Development page, "/project-documents". Every POC has it.
     The PRD and the Architecture are rendered in place, not in frames: ../docs/PRD.js and
     ../docs/Architecture.js are generated copies of .wag/docs/PRD.md and .wag/docs/Architecture.md
     (the sources of truth — never edit the copies, regenerate them), and marked turns their markdown
     into the page's own HTML, in the page's own theme. A plain-text directory tree in a code block is
     drawn as a real tree here; the markdown keeps its text tree. Download saves the markdown under the
     source's name. The backlog is rendered the same way, from ../docs/backlog/: index.js lists one
     generated file per epic folder under .wag/backlog/ and loads them; the page shows a three-level
     accordion — Backlog, then each epic (its epic.md), then each of its PBIs. Accordions at the same
     level share a name, so opening one closes the others: the top three, the epics, and each epic's
     PBIs. When closing a long sibling leaves the newly opened accordion's header above the screen, the
     page scrolls that header back into view, just under the top bar (--top-bar). An open accordion's
     header takes the accent tint, and each level's open content is a shade darker than the level around
     it, so the nesting reads at a glance. The markup contract is the comment at the top of shell.js. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{PROJECT_NAME}}</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script src="../data.js"></script>
  <script src="../docs/PRD.js"></script>
  <script src="../docs/Architecture.js"></script>
  <script src="../docs/backlog/index.js"></script>
  <script src="../shell.js"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background); --color-foreground: var(--foreground);
      --color-card: var(--card); --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover); --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary); --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary); --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted); --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent); --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive); --color-border: var(--border);
      --color-input: var(--input); --color-ring: var(--ring);
      --radius-sm: calc(var(--radius) - 4px); --radius-md: calc(var(--radius) - 2px);
      --radius-lg: var(--radius); --radius-xl: calc(var(--radius) + 4px);
    }
    @layer base { * { @apply border-border; } }
  </style>
  <!-- Tailwind strips heading, list, table and code styling; this puts it back for a rendered document. -->
  <style>
    .doc { max-width: 56rem; font-size: 0.9375rem; }
    .doc h1, .doc h2, .doc h3 { font-weight: 600; letter-spacing: -0.01em; }
    .doc h1 { font-size: 2rem; margin: 0 0 0.75rem; }
    .doc h2 { font-size: 1.5rem; margin: 2rem 0 0.5rem; padding-bottom: 0.25rem; border-bottom: 1px solid var(--border); }
    .doc h3 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; }
    .doc h4 { font-size: 1rem; font-weight: 600; margin: 1.25rem 0 0.25rem; }
    .doc p { margin: 0.5rem 0; line-height: 1.65; }
    .doc ul { list-style: disc; padding-left: 1.5rem; margin: 0.5rem 0; }
    .doc ol { list-style: decimal; padding-left: 1.5rem; margin: 0.5rem 0; }
    .doc li { margin: 0.25rem 0; line-height: 1.6; }
    .doc li > ul, .doc li > ol { margin: 0.25rem 0; }
    .doc strong { font-weight: 600; }
    .doc a { text-decoration: underline; text-underline-offset: 2px; }
    .doc code { font-size: 0.85em; padding: 0.1rem 0.3rem; border-radius: 0.25rem; background: var(--muted); }
    .doc pre { margin: 1rem 0; padding: 0.75rem 1rem; border-radius: 0.5rem; background: var(--muted); overflow-x: auto; font-size: 0.8rem; line-height: 1.5; }
    .doc pre code { padding: 0; background: none; font-size: inherit; }
    .doc table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.875rem; }
    .doc th, .doc td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
    .doc th { background: var(--muted); font-weight: 600; }
    .doc .tree { display: grid; grid-template-columns: max-content 1fr; column-gap: 2rem; row-gap: 0.2rem; margin: 1rem 0; padding: 0.75rem 1rem; border-radius: 0.5rem; background: var(--muted); font-size: 0.8125rem; overflow-x: auto; }
    .doc .tree-name { display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .doc .tree-name svg { flex: none; color: var(--muted-foreground); }
    .doc .tree-name .tree-folder { fill: currentColor; }
    .doc .tree-note { color: var(--muted-foreground); }
    /* Epics and PBIs sit inside accordions, so their headings step down a size. */
    .doc-nested h1 { font-size: 1.35rem; }
    .doc-nested h2 { font-size: 1.1rem; margin-top: 1.25rem; }
    .doc-nested ul:has(input[type="checkbox"]) { list-style: none; padding-left: 0.25rem; }
    .doc-nested input[type="checkbox"] { margin-right: 0.4rem; }
    /* The height of the shell's sticky top bar, if it has one: scrolling an accordion's header into
       view stops just under it. The starter's shell has none. */
    :root { --top-bar: 0px; }
    details[name] > summary { scroll-margin-top: calc(var(--top-bar) + 1rem); }

    /* Telling the levels apart. An open accordion's header takes the accent tint, with an accent chevron,
       so it's clear which header the content below belongs to. Each level's open content is a shade
       darker than the level around it: the top three open onto the card colour, an epic onto the page
       background darkened a little, and a PBI onto it darkened more. Stepping from the background
       itself keeps the levels apart even in a theme whose card and background are the same colour.
       Dark mode steps down further, since a dark background needs more to show the change.
       A closed header is never the colour of what it sits on: it's that colour nudged toward the text
       colour (lighter in dark mode, darker in light), so where an epic or a PBI starts is plain to see. */
    :root { --level-2: color-mix(in srgb, var(--background), black 3%); --level-3: color-mix(in srgb, var(--background), black 6%); }
    .dark { --level-2: color-mix(in srgb, var(--background), black 20%); --level-3: color-mix(in srgb, var(--background), black 40%); }
    details[name] { overflow: hidden; }
    details[name][open] > summary { background: var(--accent); }
    details[name][open] > summary > svg.lucide-chevron-right { color: var(--accent-foreground); }
    .level-1-body { background: var(--card); }
    .level-2-body { background: var(--level-2); }
    .level-3-body { background: var(--level-3); }
    .level-2-head { background: color-mix(in srgb, var(--foreground) 8%, var(--card)); }
    .level-3-head { background: color-mix(in srgb, var(--foreground) 8%, var(--level-2)); }
  </style>
</head>
<body class="bg-background text-foreground antialiased" data-auth="in">

  <main data-page="Project Documents">
    <h1 class="text-2xl font-semibold">Project Documents</h1>
    <p class="mt-1 text-sm text-muted-foreground">The documents behind this POC.</p>
    <div class="mt-6 space-y-3">
      <details name="project-docs" data-slot="accordion-item" class="group rounded-xl border bg-card">
        <summary class="flex cursor-pointer list-none items-center gap-3 px-4 py-3 font-medium">
          <i data-lucide="chevron-right" class="size-4 transition-transform group-open:rotate-90"></i>
          <span class="flex-1">PRD</span>
          <button type="button" data-download="prd" class="inline-flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground"><i data-lucide="download" class="size-4"></i> Download</button>
        </summary>
        <div class="level-1-body border-t px-6 py-5">
          <p data-doc-note="prd" class="mb-4 text-xs text-muted-foreground"></p>
          <article data-doc="prd" class="doc"></article>
        </div>
      </details>
      <details name="project-docs" data-slot="accordion-item" class="group rounded-xl border bg-card">
        <summary class="flex cursor-pointer list-none items-center gap-3 px-4 py-3 font-medium">
          <i data-lucide="chevron-right" class="size-4 transition-transform group-open:rotate-90"></i>
          <span class="flex-1">Architecture</span>
          <button type="button" data-download="architecture" class="inline-flex items-center gap-1 text-sm text-muted-foreground hover:text-foreground"><i data-lucide="download" class="size-4"></i> Download</button>
        </summary>
        <div class="level-1-body border-t px-6 py-5">
          <p data-doc-note="architecture" class="mb-4 text-xs text-muted-foreground"></p>
          <article data-doc="architecture" class="doc"></article>
        </div>
      </details>
      <details name="project-docs" data-slot="accordion-item" class="group rounded-xl border bg-card">
        <summary class="flex cursor-pointer list-none items-center gap-3 px-4 py-3 font-medium">
          <i data-lucide="chevron-right" class="size-4 transition-transform group-open:rotate-90"></i>
          <span class="flex-1">Backlog</span>
        </summary>
        <div class="level-1-body border-t px-6 py-5">
          <p data-backlog-note class="mb-4 text-xs text-muted-foreground"></p>
          <div data-backlog class="space-y-2"></div>
        </div>
      </details>
    </div>
  </main>

  <script>
    // Render each generated doc in place, and say where it came from.
    const docs = window.POC_DOCS ?? {}
    for (const el of document.querySelectorAll('[data-doc]'))
      el.innerHTML = docs[el.dataset.doc]
        ? marked.parse(docs[el.dataset.doc].markdown)
        : '<p>Not generated yet.</p>'
    for (const el of document.querySelectorAll('[data-doc-note]'))
      el.textContent = docs[el.dataset.docNote]
        ? `Rendered from ${docs[el.dataset.docNote].source} · generated ${docs[el.dataset.docNote].generated} · a copy, do not edit here`
        : ''

    // The backlog: one accordion per epic, showing its epic.md, with one accordion per PBI inside it.
    // Named groups (group/epic, group/pbi) keep each chevron turning with its own accordion only.
    // The name attribute makes each level exclusive: all epics share one name, and each epic's PBIs share
    // a name of their own, so opening one closes its siblings and nothing else.
    const backlog = window.POC_BACKLOG
    const backlogEl = document.querySelector('[data-backlog]')
    const chevron = group => `<i data-lucide="chevron-right" class="size-4 transition-transform group-open/${group}:rotate-90"></i>`
    // The accordion's header already names the epic or PBI, so its file's own "# " title isn't shown again.
    const body = markdown => marked.parse(markdown.replace(/^#\s.*\n+/, ''))
    if (backlog?.epics.length) {
      document.querySelector('[data-backlog-note]').textContent =
        `Rendered from ${backlog.source} · generated ${backlog.generated} · a copy, do not edit here`
      backlogEl.innerHTML = backlog.epics.map(epic => `
        <details name="backlog-epics" data-slot="accordion-item" class="group/epic rounded-lg border">
          <summary class="level-2-head flex cursor-pointer list-none items-center gap-3 px-4 py-2 font-medium">
            ${chevron('epic')}
            <span class="flex-1">Epic ${esc(epic.id)} — ${esc(epic.title)}</span>
            <span class="text-xs text-muted-foreground">${epic.pbis.length} PBIs</span>
          </summary>
          <div class="level-2-body border-t px-5 py-4">
            <article class="doc doc-nested">${body(epic.markdown)}</article>
            <div class="mt-4 space-y-2">${epic.pbis.map(pbi => `
              <details name="epic-${esc(epic.id)}-pbis" data-slot="accordion-item" class="group/pbi rounded-lg border">
                <summary class="level-3-head flex cursor-pointer list-none items-center gap-3 px-4 py-2 text-sm font-medium">
                  ${chevron('pbi')}
                  <span class="flex-1">PBI ${esc(pbi.id)} — ${esc(pbi.title)}</span>
                </summary>
                <article class="level-3-body doc doc-nested border-t px-5 py-4">${body(pbi.markdown)}</article>
              </details>`).join('')}
            </div>
          </div>
        </details>`).join('')
    }
    else
      backlogEl.innerHTML = '<p class="text-sm text-muted-foreground">Not generated yet.</p>'

    // Opening an accordion closes its open sibling. If that sibling was long and sat above it, the page
    // doesn't move, and the newly opened accordion's header ends up above the screen — you land in the
    // middle or at the bottom of what you just opened. So when an accordion opens with its header hidden
    // under the top bar or above it, scroll the header back into view. "toggle" doesn't bubble, hence
    // the capture listener; it fires after the sibling has closed, so the measurement is current.
    const topBar = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top-bar')) || 0
    document.addEventListener('toggle', e => {
      const opened = e.target
      if (!(opened instanceof HTMLDetailsElement) || !opened.open || !opened.name)
        return
      const summary = opened.querySelector(':scope > summary')
      if (summary.getBoundingClientRect().top < topBar)
        summary.scrollIntoView({ block: 'start' })
    }, true)

    // A plain-text directory tree (├── / └── lines, "# comment" at the end) becomes a real tree:
    // a folder or file icon per line, indented by depth, its comment in a column of its own.
    // A line is a folder if its name ends in "/" or the next line sits deeper. Folders are filled,
    // files are outlines, both in the same muted colour.
    function renderTree(text) {
      const rows = text.trimEnd().split('\n').map(line => {
        const [, path, note = ''] = line.match(/^(.*?)(?:\s+#\s+(.*))?$/)
        const [, indent, branch, name] = path.match(/^((?:│   |    )*)(├── |└── )?(.*)$/)
        return { depth: indent.length / 4 + (branch ? 1 : 0), name: name.trim(), note }
      })
      return '<div class="tree">' + rows.map((r, i) => {
        const folder = r.name.endsWith('/') || rows[i + 1]?.depth > r.depth
        return `<span class="tree-name" style="padding-left: ${r.depth * 1.25}rem"><i data-lucide="${folder ? 'folder' : 'file'}" class="size-3.5${folder ? ' tree-folder' : ''}"></i>${esc(r.name)}</span><span class="tree-note">${esc(r.note)}</span>`
      }).join('') + '</div>'
    }
    for (const code of document.querySelectorAll('.doc pre > code'))
      if (/[├└]── /.test(code.textContent))
        code.parentElement.outerHTML = renderTree(code.textContent)
    lucide.createIcons()

    // Download saves the markdown itself, under the source's name.
    document.addEventListener('click', e => {
      const doc = docs[e.target.closest('[data-download]')?.dataset.download]
      if (!doc)
        return
      e.preventDefault()
      const a = document.createElement('a')
      a.href = URL.createObjectURL(new Blob([doc.markdown], { type: 'text/markdown' }))
      a.download = doc.file
      a.click()
    })
  </script>

</body>
</html>
