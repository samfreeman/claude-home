<!doctype html>
<!-- WAG POC starter: the "/sign-in" route. The markup contract is the comment at the top of shell.js. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{PROJECT_NAME}}</title>
  <link rel="stylesheet" href="../theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="../data.js"></script>
  <script src="../shell.js"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background); --color-foreground: var(--foreground);
      --color-card: var(--card); --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover); --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary); --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary); --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted); --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent); --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive); --color-border: var(--border);
      --color-input: var(--input); --color-ring: var(--ring);
      --radius-sm: calc(var(--radius) - 4px); --radius-md: calc(var(--radius) - 2px);
      --radius-lg: var(--radius); --radius-xl: calc(var(--radius) + 4px);
    }
    @layer base { * { @apply border-border; } }
  </style>
</head>
<body class="bg-background text-foreground antialiased" data-auth="out">

  <main data-page="Sign in" class="flex min-h-screen items-center justify-center px-6">
    <div data-slot="card" class="w-full max-w-sm rounded-xl border bg-card p-6 text-card-foreground shadow-sm">
      <h1 data-fill class="text-xl font-semibold">Sign in to {{app.name}}</h1>
      <p class="mt-1 text-sm text-muted-foreground">Simulated — any button signs you in.</p>
      <button data-slot="button" data-variant="outline" data-action="sign-in"
        class="mt-6 inline-flex h-9 w-full items-center justify-center gap-2 rounded-md border bg-background text-sm font-medium shadow-xs hover:bg-accent">
        <i data-lucide="log-in" class="size-4"></i> Continue with Google
      </button>
      <a href="index.html" class="mt-4 block text-center text-sm text-muted-foreground hover:text-foreground">Back</a>
    </div>
  </main>

</body>
</html>
