<!doctype html>
<!--
  WAG mockup starter — see ~/.claude/wag/references/mockups.md for the rules.

  Markup contract (the screenshot script reads it):
    data-route="<route>"      one per route in the PRD's UI pages table; one PNG each
    data-state="<state>"      only when one route has two looks (e.g. "/" signed-out / signed-in)
    data-page="<page name>"   the PRD's page name — becomes the image alt text / caption
    data-landing="<section>"  each landing-page section inside the signed-out "/" route; one PNG each
    data-review               review-only chrome (route labels, theme switch); never in a screenshot

  Static picture, not a prototype: no links that go anywhere, no fixed/sticky positioning
  (it would bleed into every screenshot), no animation that hides content until it runs.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{PROJECT_NAME}} — mockup</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @custom-variant dark (&:where(.dark, .dark *));
    @theme inline {
      --color-background: var(--background);
      --color-foreground: var(--foreground);
      --color-card: var(--card);
      --color-card-foreground: var(--card-foreground);
      --color-popover: var(--popover);
      --color-popover-foreground: var(--popover-foreground);
      --color-primary: var(--primary);
      --color-primary-foreground: var(--primary-foreground);
      --color-secondary: var(--secondary);
      --color-secondary-foreground: var(--secondary-foreground);
      --color-muted: var(--muted);
      --color-muted-foreground: var(--muted-foreground);
      --color-accent: var(--accent);
      --color-accent-foreground: var(--accent-foreground);
      --color-destructive: var(--destructive);
      --color-border: var(--border);
      --color-input: var(--input);
      --color-ring: var(--ring);
      --radius-sm: calc(var(--radius) - 4px);
      --radius-md: calc(var(--radius) - 2px);
      --radius-lg: var(--radius);
      --radius-xl: calc(var(--radius) + 4px);
    }
    @layer base {
      * { @apply border-border; }
    }
  </style>
  <style>
    /* The project's tweakcn theme: paste its :root and .dark blocks over these
       shadcn neutral defaults. Architecture's Design direction names the theme. */
    :root {
      --radius: 0.625rem;
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.145 0 0);
      --popover: oklch(1 0 0);
      --popover-foreground: oklch(0.145 0 0);
      --primary: oklch(0.205 0 0);
      --primary-foreground: oklch(0.985 0 0);
      --secondary: oklch(0.97 0 0);
      --secondary-foreground: oklch(0.205 0 0);
      --muted: oklch(0.97 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --accent: oklch(0.97 0 0);
      --accent-foreground: oklch(0.205 0 0);
      --destructive: oklch(0.577 0.245 27.325);
      --border: oklch(0.922 0 0);
      --input: oklch(0.922 0 0);
      --ring: oklch(0.708 0 0);
    }
    .dark {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --popover: oklch(0.205 0 0);
      --popover-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --destructive: oklch(0.704 0.191 22.216);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
    }
  </style>
  <script>
    if (matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.add('dark')
  </script>
</head>
<body class="bg-background text-foreground antialiased">

  <!-- Review chrome: flips light/dark while reviewing. Hidden in screenshots. -->
  <button data-review onclick="document.documentElement.classList.toggle('dark')"
    class="fixed bottom-4 right-4 z-50 rounded-full border bg-card px-4 py-2 text-sm shadow-lg">
    Light / dark
  </button>

  <div data-review class="bg-muted px-6 py-2 font-mono text-xs uppercase tracking-widest text-muted-foreground">/ — signed out</div>
  <section data-route="/" data-state="signed-out" data-page="Landing">
    <header data-landing="navbar" class="border-b">
      <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6">
        <span class="font-semibold">{{PROJECT_NAME}}</span>
        <div class="flex items-center gap-2">
          <button class="inline-flex h-9 w-9 items-center justify-center rounded-md hover:bg-accent"><i data-lucide="sun" class="size-4"></i></button>
          <button class="inline-flex h-9 items-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground shadow-xs">Sign in</button>
        </div>
      </div>
    </header>
    <section data-landing="hero" class="flex min-h-[640px] flex-col items-center justify-center px-6 py-24 text-center">
      <div class="mx-auto max-w-5xl">
        <span class="inline-flex items-center gap-2 rounded-full border px-3 py-1 font-mono text-xs">
          <span class="size-2 rounded-full bg-primary"></span> Now in beta
        </span>
        <h1 class="mt-6 text-5xl font-bold leading-[1.05] tracking-tight md:text-7xl">
          Headline with <span class="bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">one phrase</span> lifted
        </h1>
        <p class="mx-auto mt-6 max-w-2xl text-lg text-muted-foreground md:text-xl">Subtext in muted foreground.</p>
        <div class="mt-10 flex justify-center gap-4">
          <button class="h-12 rounded-md bg-primary px-8 text-base font-semibold text-primary-foreground shadow-lg">Primary CTA</button>
          <button class="h-12 rounded-md border bg-background px-8 text-base font-semibold">Secondary</button>
        </div>
      </div>
    </section>
    <!-- …stats, how it works, pricing, FAQ, final CTA, footer — each its own data-landing section, in the standard's order -->
  </section>

  <div data-review class="bg-muted px-6 py-2 font-mono text-xs uppercase tracking-widest text-muted-foreground">/messages</div>
  <section data-route="/messages" data-page="Messages" class="flex min-h-[640px]">
    <aside class="w-56 shrink-0 border-r bg-card p-4">
      <nav class="space-y-1 text-sm">
        <a class="flex items-center gap-2 rounded-md bg-accent px-3 py-2 font-medium text-accent-foreground"><i data-lucide="inbox" class="size-4"></i> Messages</a>
        <a class="flex items-center gap-2 rounded-md px-3 py-2 text-muted-foreground"><i data-lucide="settings" class="size-4"></i> Settings</a>
      </nav>
    </aside>
    <main class="flex-1 p-6">
      <div class="flex items-center gap-2">
        <input class="h-9 w-full max-w-sm rounded-md border border-input bg-transparent px-3 text-sm shadow-xs" placeholder="Search…">
        <button class="h-9 rounded-md border bg-background px-4 text-sm font-medium shadow-xs">Filter</button>
      </div>
      <div class="mt-6 rounded-xl border bg-card p-4 text-card-foreground shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium">Realistic name</span>
          <span class="inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-medium">chat</span>
        </div>
        <p class="mt-2 text-sm text-muted-foreground">Realistic fake content, never lorem ipsum.</p>
      </div>
    </main>
  </section>

  <script>lucide.createIcons()</script>
</body>
</html>
